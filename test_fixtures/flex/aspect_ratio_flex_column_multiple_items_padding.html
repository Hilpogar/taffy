<!DOCTYPE html>

<style>
  * {
    box-sizing: content-box !important;
  }
</style>

<html lang="en">
  <head>
    <script src="../../scripts/gentest/test_helper.js"></script>
    <link
      rel="stylesheet"
      type="text/css"
      href="../../scripts/gentest/test_base_style.css"
    />
    <title>Test description</title>
  </head>
  <body>
    <div id="test-root" style="display: flex; flex-direction: column; height: 100px">
      <!-- Ratio 1/1 -->
      <div
        style="
          aspect-ratio: 1 / 1;
          background: #90caf9;
          padding: 5px 10px;
        "
      ></div>
      
      <div
        style="
          aspect-ratio: 1 / 1;
          background: #eecaf9;
          padding: 5px;
        "
      ></div>

      <!-- Ratio 16/9 -->
      <div
        style="
          aspect-ratio: 16 / 9;
          background: #a5d6a7;
          padding: 20px;
        "
      ></div>
    </div>
  </body>
</html>
